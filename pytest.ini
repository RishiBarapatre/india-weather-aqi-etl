[pytest]
# Make pytest find modules relative to the project root
# (so `from include.transform.weather import ...` works without installing the package)
pythonpath = .

# Test discovery
testpaths = tests

# Output options
addopts =
    --tb=short
    -v

# Show which tests were slow (> 1 second)
# Useful for spotting accidentally un-mocked DB calls
# Requires: pip install pytest-durations
# filterwarnings = ignore::DeprecationWarning
